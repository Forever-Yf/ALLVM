name: Fix staged VMP patch part 2

on:
  push:
    branches:
      - hardening/p0-secure-seeding-doctor
    paths:
      - .github/workflows/fix-vmp-patch-part2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: .github/patches
          sparse-checkout-cone-mode: false
      - name: Repair and verify staged payload
        shell: bash
        run: |
          truncate -s -1 .github/patches/vmp-integrity-00.b64
          test "$(wc -c < .github/patches/vmp-integrity-00.b64)" = "6000"
          test "$(sha256sum .github/patches/vmp-integrity-00.b64 | cut -d' ' -f1)" = "58ae88c6c5ed13221f632a532e7d03d9ebf525da2f1634598202227b577e7176"
          cat .github/patches/vmp-integrity-*.b64 > /tmp/patch.b64
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          raw = gzip.decompress(base64.b64decode(Path('/tmp/patch.b64').read_bytes(), validate=True))
          assert len(raw) == 50326
          assert hashlib.sha256(raw).hexdigest() == '34ce580f2452d39e69e0fe9eba5b26be963e6cd7a226c69e2ff35cfbe5d7b0ab'
          PY
          git add .github/patches/vmp-integrity-00.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix staged VMP integrity patch boundary"
          git push origin HEAD:hardening/p0-secure-seeding-doctor
