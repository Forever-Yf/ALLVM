name: Apply VMP runtime follow-up hardening

on:
  push:
    branches:
      - hardening/p0-secure-seeding-doctor
    paths:
      - .github/workflows/apply-vmp-runtime-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out interpreter and helper
        uses: actions/checkout@v4
        with:
          ref: hardening/p0-secure-seeding-doctor
          fetch-depth: 0
          sparse-checkout: |
            .github/workflows/apply-vmp-runtime-followup.yml
            aVMPInterpreter/aVMPInterpreter.c
            tools/_apply_vmp_runtime_followup.py
          sparse-checkout-cone-mode: false

      - name: Apply exact runtime follow-up edits
        run: python3 tools/_apply_vmp_runtime_followup.py

      - name: Validate runtime follow-up markers
        shell: bash
        run: |
          grep -q 'remaining_code / bytes_per_case' aVMPInterpreter/aVMPInterpreter.c
          grep -q 'VM_FORCE_INLINE static __inline__' aVMPInterpreter/aVMPInterpreter.c
          grep -q 'data_seg_clean((int)var_size)' aVMPInterpreter/aVMPInterpreter.c
          grep -q 'if (vm_fault != VM_FAULT_NONE)' aVMPInterpreter/aVMPInterpreter.c

      - name: Remove one-time helpers
        run: |
          git rm .github/workflows/apply-vmp-runtime-followup.yml
          git rm tools/_apply_vmp_runtime_followup.py

      - name: Commit runtime follow-up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aVMPInterpreter/aVMPInterpreter.c
          git commit -m "vmp: bound switch tables and clear transient data"
          git push origin HEAD:hardening/p0-secure-seeding-doctor
