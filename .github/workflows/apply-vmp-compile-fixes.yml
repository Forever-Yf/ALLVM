name: Apply VMP compile fixes

on:
  push:
    branches:
      - hardening/p0-secure-seeding-doctor
    paths:
      - .github/workflows/apply-vmp-compile-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out affected source
        uses: actions/checkout@v4
        with:
          ref: hardening/p0-secure-seeding-doctor
          fetch-depth: 0
          sparse-checkout: |
            .github/workflows/apply-vmp-compile-fixes.yml
            llvm/lib/Transforms/Obfuscation/aVMP.cpp
          sparse-checkout-cone-mode: false

      - name: Fix LLVM diagnostic construction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('llvm/lib/Transforms/Obfuscation/aVMP.cpp')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "        report_fatal_error(\n"
                  "            (Twine(\"legacy VMP compatibility check failed for '\") +\n"
                  "             F.getName() + \"'\").str());\n",
                  "        report_fatal_error(\n"
                  "            Twine(\"legacy VMP compatibility check failed for '\") +\n"
                  "            F.getName() + \"'\");\n",
              ),
              (
                  "                failTranslation(Twine(\"unsupported constant value: \") +\n"
                  "                                Twine(*const_value));\n",
                  "                failTranslation(\n"
                  "                    Twine(\"unsupported constant value in function '\") +\n"
                  "                    F->getName() + \"'\");\n",
              ),
              (
                  "                        failTranslation(Twine(\"value is missing from VMP data map: \") +\n"
                  "                                        Twine(*value));\n",
                  "                        failTranslation(\n"
                  "                            Twine(\"value is missing from VMP data map in function '\") +\n"
                  "                            F->getName() + \"'\");\n",
              ),
              (
                  "        report_fatal_error(\n"
                  "            (Twine(\"legacy VMP produced invalid IR for '\") + F.getName() + \"'\").str());\n",
                  "        report_fatal_error(\n"
                  "            Twine(\"legacy VMP produced invalid IR for '\") +\n"
                  "            F.getName() + \"'\");\n",
              ),
          ]

          for index, (old, new) in enumerate(replacements, start=1):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'replacement {index}: expected one match, found {count}'
                  )
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate compile-fix markers
        shell: bash
        run: |
          ! grep -q 'Twine(\*const_value)' llvm/lib/Transforms/Obfuscation/aVMP.cpp
          ! grep -q 'Twine(\*value)' llvm/lib/Transforms/Obfuscation/aVMP.cpp
          ! grep -q 'report_fatal_error.*\.str' llvm/lib/Transforms/Obfuscation/aVMP.cpp

      - name: Remove one-time workflow
        run: git rm .github/workflows/apply-vmp-compile-fixes.yml

      - name: Commit compile fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llvm/lib/Transforms/Obfuscation/aVMP.cpp
          git commit -m "vmp: fix LLVM diagnostic construction"
          git push origin HEAD:hardening/p0-secure-seeding-doctor
