name: Apply documentation and build follow-up

on:
  push:
    branches:
      - hardening/p0-secure-seeding-doctor
    paths:
      - .github/workflows/apply-doc-build-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact follow-up edits
        run: python3 tools/apply-doc-build-followup.py

      - name: Check formatting
        run: git diff --check

      - name: Remove one-time helpers
        run: |
          rm tools/apply-doc-build-followup.py
          rm .github/workflows/apply-doc-build-followup.yml

      - name: Commit follow-up edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            build.cpp \
            README.md \
            docs/ALLVM_HARDENING.md \
            tools/apply-doc-build-followup.py \
            .github/workflows/apply-doc-build-followup.yml
          git commit -m "document safe build helper and finalize headers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
