name: Apply VMP attribute timing fix

on:
  push:
    branches:
      - hardening/p0-secure-seeding-doctor
    paths:
      - .github/workflows/apply-vmp-attribute-timing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out affected source
        uses: actions/checkout@v4
        with:
          ref: hardening/p0-secure-seeding-doctor
          fetch-depth: 0
          sparse-checkout: |
            .github/workflows/apply-vmp-attribute-timing.yml
            llvm/lib/Transforms/Obfuscation/aVMP.cpp
          sparse-checkout-cone-mode: false

      - name: Move function attributes behind successful setup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('llvm/lib/Transforms/Obfuscation/aVMP.cpp')
          text = path.read_text(encoding='utf-8')

          old = (
              '    GOVMModifier Modifier(&F, Translator.get_gv_value_map(),\n'
              '                          Translator.get_value_map());\n'
          )
          new = (
              '    prepareVMPFunction(F);\n'
              '    GOVMModifier Modifier(&F, Translator.get_gv_value_map(),\n'
              '                          Translator.get_value_map());\n'
          )
          if text.count(old) != 1:
              raise SystemExit('modifier insertion point is not unique')
          text = text.replace(old, new, 1)

          eager = (
              '      prepareVMPFunction(F);\n'
              '      FunctionsToProcess.push_back(&F);\n'
          )
          count = text.count(eager)
          if count != 2:
              raise SystemExit(f'expected two eager attribute sites, found {count}')
          text = text.replace(eager, '      FunctionsToProcess.push_back(&F);\n')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate attribute timing
        shell: bash
        run: |
          test "$(grep -c 'prepareVMPFunction(F);' llvm/lib/Transforms/Obfuscation/aVMP.cpp)" -eq 1
          python3 - <<'PY'
          from pathlib import Path
          text = Path('llvm/lib/Transforms/Obfuscation/aVMP.cpp').read_text(encoding='utf-8')
          prepare = text.index('    prepareVMPFunction(F);')
          interpreter = text.index('    if (!Interpreter.run())')
          modifier = text.index('    GOVMModifier Modifier')
          if not interpreter < prepare < modifier:
              raise SystemExit('VMP attributes are not applied after interpreter setup')
          PY

      - name: Remove one-time workflow
        run: git rm .github/workflows/apply-vmp-attribute-timing.yml

      - name: Commit attribute timing fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llvm/lib/Transforms/Obfuscation/aVMP.cpp
          git commit -m "vmp: avoid attributes on skipped functions"
          git push origin HEAD:hardening/p0-secure-seeding-doctor
