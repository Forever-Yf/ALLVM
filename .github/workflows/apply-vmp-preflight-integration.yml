name: Apply VMP preflight integration

on:
  push:
    branches:
      - hardening/p0-secure-seeding-doctor
    paths:
      - .github/workflows/apply-vmp-preflight-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch and previous payload
        uses: actions/checkout@v4
        with:
          ref: hardening/p0-secure-seeding-doctor
          fetch-depth: 5
          sparse-checkout: |
            .github/workflows/apply-vmp-preflight-integration.yml
            llvm/lib/Transforms/Obfuscation/aVMP.cpp
          sparse-checkout-cone-mode: false

      - name: Extract and run the validated patch payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          marker = "          python3 - <<'PY'"
          source = None
          for revision in ('HEAD^', 'HEAD^^', 'HEAD^^^', 'HEAD^^^^'):
              try:
                  candidate = subprocess.check_output(
                      ['git', 'show', f'{revision}:.github/workflows/apply-vmp-preflight-integration.yml'],
                      text=True,
                  ).splitlines()
              except subprocess.CalledProcessError:
                  continue
              if marker in candidate and any('def replace_once' in line for line in candidate):
                  source = candidate
                  break

          if source is None:
              raise SystemExit('could not locate the original VMP patch payload')

          start = source.index(marker) + 1
          end = source.index("          PY", start)
          payload_lines = []
          in_triple_string = False
          for line in source[start:end]:
              processed = line
              if not in_triple_string and line.startswith('          '):
                  processed = line[10:]
              payload_lines.append(processed)
              if line.count("'''") % 2 == 1:
                  in_triple_string = not in_triple_string

          Path('/tmp/apply-vmp-preflight.py').write_text(
              '\n'.join(payload_lines) + '\n', encoding='utf-8'
          )
          PY
          python3 /tmp/apply-vmp-preflight.py

      - name: Check integration markers
        shell: bash
        run: |
          grep -q 'analyzeVMPFunction' llvm/lib/Transforms/Obfuscation/aVMP.cpp
          grep -q 'irobf-vmp-strict' llvm/lib/Transforms/Obfuscation/aVMP.cpp
          grep -q 'setThreadLocal(true)' llvm/lib/Transforms/Obfuscation/aVMP.cpp
          grep -q 'runVMPOnFunction' llvm/lib/Transforms/Obfuscation/aVMP.cpp
          ! grep -q 'MAX_BASIC_BLOCKS' llvm/lib/Transforms/Obfuscation/aVMP.cpp
          ! grep -q 'VM_CODE_SEG_SIZE' llvm/lib/Transforms/Obfuscation/aVMP.cpp

      - name: Remove one-time workflow
        run: git rm .github/workflows/apply-vmp-preflight-integration.yml

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llvm/lib/Transforms/Obfuscation/aVMP.cpp
          git commit -m "vmp: integrate compatibility and resource preflight"
          git push origin HEAD:hardening/p0-secure-seeding-doctor
