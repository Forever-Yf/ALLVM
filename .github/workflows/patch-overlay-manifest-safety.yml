name: Apply overlay manifest path hardening

on:
  push:
    branches:
      - usability/p2-sync-gradle-overlay-status
    paths:
      - .github/workflows/patch-overlay-manifest-safety.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            configs/profiles
            docs/ALLVM_USAGE_CN.md
            tools/allvm.py
            tools/allvm-doctor.py
            tools/test-allvm-cli.py
            tools/apply-overlay-manifest-safety.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply hardening and run complete CLI regression
        run: |
          python -m py_compile tools/apply-overlay-manifest-safety.py
          python tools/apply-overlay-manifest-safety.py
          python -m py_compile tools/allvm.py tools/test-allvm-cli.py
          python tools/test-allvm-cli.py

      - name: Commit validated implementation
        run: |
          git rm tools/apply-overlay-manifest-safety.py
          git add \
            docs/ALLVM_USAGE_CN.md \
            tools/allvm.py \
            tools/test-allvm-cli.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "confine overlay manifest paths and detect new tools"
          git push origin HEAD:usability/p2-sync-gradle-overlay-status
