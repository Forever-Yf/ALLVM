name: Apply string random hardening

on:
  push:
    branches:
      - hardening/p0-secure-seeding-doctor
    paths:
      - .github/workflows/apply-string-random-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact string hardening
        run: python3 tools/apply-string-random-hardening.py

      - name: Check formatting
        run: git diff --check

      - name: Remove one-time helpers
        run: |
          rm tools/apply-string-random-hardening.py
          rm .github/workflows/apply-string-random-hardening.yml

      - name: Commit string hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            llvm/lib/Transforms/Obfuscation/StringEncryption.cpp \
            tools/apply-string-random-hardening.py \
            .github/workflows/apply-string-random-hardening.yml
          git commit -m "harden string pass random domains and buffers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
