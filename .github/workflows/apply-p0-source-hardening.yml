name: Apply guarded P0 source hardening

on:
  push:
    branches:
      - hardening/p0-secure-seeding-doctor
    paths:
      - .github/workflows/apply-p0-source-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact source patches
        run: python3 tools/apply-p0-source-hardening.py

      - name: Check patch formatting
        run: git diff --check

      - name: Remove one-time helpers
        run: |
          rm tools/apply-p0-source-hardening.py
          rm .github/workflows/apply-p0-source-hardening.yml

      - name: Commit guarded source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            llvm/lib/Transforms/Obfuscation/CryptoUtils.cpp \
            llvm/lib/Transforms/Obfuscation/aVMP.cpp \
            tools/apply-p0-source-hardening.py \
            .github/workflows/apply-p0-source-hardening.yml
          git commit -m "harden CryptoUtils and legacy VMP seeding"
          git push origin "HEAD:${GITHUB_REF_NAME}"
