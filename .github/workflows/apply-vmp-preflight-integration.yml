name: Apply VMP preflight integration

on:
  push:
    branches:
      - hardening/p0-secure-seeding-doctor
    paths:
      - .github/workflows/apply-vmp-preflight-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: hardening/p0-secure-seeding-doctor
          fetch-depth: 0
          sparse-checkout: |
            .github/workflows/apply-vmp-preflight-integration.yml
            llvm/lib/Transforms/Obfuscation/aVMP.cpp
          sparse-checkout-cone-mode: false

      - name: Apply exact VMP integration edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("llvm/lib/Transforms/Obfuscation/aVMP.cpp")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              text = text.replace(old, new, 1)

          def regex_once(pattern: str, replacement: str, label: str) -> None:
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected one regex match, found {count}")

          replace_once(
              '#include "llvm/Transforms/Obfuscation/SecureRandom.h"\n',
              '#include "llvm/Transforms/Obfuscation/SecureRandom.h"\n'
              '#include "llvm/Transforms/Obfuscation/VMPCompatibility.h"\n'
              '#include "llvm/IR/IntrinsicInst.h"\n'
              '#include "llvm/Support/ErrorHandling.h"\n',
              "includes",
          )
          replace_once(
              '#include <map>\n#include <memory>\n',
              '#include <limits>\n#include <map>\n#include <memory>\n',
              "limits include",
          )
