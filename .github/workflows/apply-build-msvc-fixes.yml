name: Apply MSVC build-helper fixes

on:
  push:
    branches:
      - hardening/p0-secure-seeding-doctor
    paths:
      - .github/workflows/apply-build-msvc-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact build-helper fixes
        run: python3 tools/apply-build-msvc-fixes.py

      - name: Check formatting
        run: git diff --check

      - name: Remove one-time helpers
        run: |
          rm tools/apply-build-msvc-fixes.py
          rm .github/workflows/apply-build-msvc-fixes.yml

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            build.cpp \
            tools/apply-build-msvc-fixes.py \
            .github/workflows/apply-build-msvc-fixes.yml
          git commit -m "fix MSVC warnings and reusable install flow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
