name: Publish authenticated VMP blocks and budgets

on:
  push:
    branches:
      - hardening/p0-secure-seeding-doctor
    paths:
      - .github/workflows/apply-vmp-auth-budgets-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out required files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github/workflows/apply-vmp-auth-budgets-v3.yml
            .github/workflows/hardening-smoke.yml
            README.md
            docs/ALLVM_HARDENING.md
            build.cpp
            aVMPInterpreter/aVMPInterpreter.c
            aVMPInterpreter/aVMPInterpreter.h
            aVMPInterpreter/aVMPInterpreter.bc
            aVMPInterpreter/VMPIntegrity.h
            llvm/include/llvm/CryptoUtils.h
            llvm/include/llvm/Transforms/Obfuscation
            llvm/lib/Transforms/Obfuscation/CryptoUtils.cpp
            llvm/lib/Transforms/Obfuscation/ConstantIntEncryption.cpp
            llvm/lib/Transforms/Obfuscation/ConstantFPEncryption.cpp
            llvm/lib/Transforms/Obfuscation/StringEncryption.cpp
            llvm/lib/Transforms/Obfuscation/VMPCompatibility.cpp
            llvm/lib/Transforms/Obfuscation/aVMP.cpp
            tools/allvm-doctor.py
            tools/check-hardening.py
            tools/check-vmp-embed.py
            tools/vmp-compatibility-smoke.cpp
            tools/vmp-interpreter-bounds-smoke.c
            tools/apply-vmp-auth-budgets.py
            tools/run-vmp-auth-migration.sh
          sparse-checkout-cone-mode: false

      - name: Rewrite publication tail to avoid workflow-scope push
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/run-vmp-auth-migration.sh")
          text = path.read_text(encoding="utf-8")
          marker = "git rm .github/workflows/apply-vmp-auth-budgets.yml"
          start = text.find(marker)
          if start < 0:
              raise SystemExit(f"missing publication marker: {marker}")

          tail = r'''cp .github/workflows/hardening-smoke.yml tools/hardening-smoke.next.yml
          git checkout -- .github/workflows/hardening-smoke.yml

          git rm tools/apply-vmp-auth-budgets.py
          git rm -f tools/run-vmp-auth-migration.sh
          for stale in \
            llvm/include/llvm/Transforms/Obfuscation/vm.h.bak \
            llvm/include/llvm/Transforms/Obfuscation/vm.h.backup \
            llvm/include/llvm/Transforms/Obfuscation/xVMP.h.bak; do
            if git ls-files --error-unmatch "$stale" >/dev/null 2>&1; then
              git rm "$stale"
            fi
          done

          git add --sparse \
            README.md \
            docs/ALLVM_HARDENING.md \
            aVMPInterpreter/VMPIntegrity.h \
            aVMPInterpreter/aVMPInterpreter.c \
            aVMPInterpreter/aVMPInterpreter.h \
            aVMPInterpreter/aVMPInterpreter.bc \
            llvm/include/llvm/Transforms/Obfuscation/vm.h \
            llvm/lib/Transforms/Obfuscation/VMPCompatibility.cpp \
            llvm/lib/Transforms/Obfuscation/aVMP.cpp \
            tools/check-hardening.py \
            tools/vmp-interpreter-bounds-smoke.c \
            tools/hardening-smoke.next.yml

          if ! git diff --cached --quiet -- .github/workflows; then
            echo "Refusing to publish staged workflow changes through GITHUB_TOKEN" >&2
            git diff --cached -- .github/workflows
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "add authenticated VMP blocks and runtime budgets"
          git push origin HEAD:hardening/p0-secure-seeding-doctor
          '''
          path.write_text(text[:start] + tail, encoding="utf-8")
          PY

      - name: Validate, regenerate and publish non-workflow changes
        shell: bash
        run: bash tools/run-vmp-auth-migration.sh
