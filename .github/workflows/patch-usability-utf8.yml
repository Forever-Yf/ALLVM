name: Apply Windows UTF-8 CLI fix

on:
  push:
    branches:
      - usability/p1-cli-presets-overlay
    paths:
      - .github/workflows/patch-usability-utf8.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            configs/profiles
            tools/allvm.py
            tools/test-allvm-cli.py
            tools/apply-usability-utf8.py
          sparse-checkout-cone-mode: false

      - name: Apply and validate UTF-8 fix
        run: |
          python3 tools/apply-usability-utf8.py
          python3 -m py_compile tools/allvm.py tools/test-allvm-cli.py
          python3 tools/test-allvm-cli.py

      - name: Commit fix
        run: |
          git add tools/allvm.py tools/test-allvm-cli.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix UTF-8 output for redirected Windows CLI"
          git push origin HEAD:usability/p1-cli-presets-overlay
